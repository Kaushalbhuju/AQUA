{% extends "basea.html" %}

{% block title %}Delete Agreement{% endblock %}

{% block extra_css %}
<style>
    h2 {
        color: #c62828;
        font-weight: 600;
        margin-bottom: 20px;
        text-align: center;
    }
    p {
        text-align: center;
        font-size: 16px;
        margin-bottom: 30px;
    }
    .delete-actions {
        display: flex;
        justify-content: center;
        gap: 20px;
    }
    .btn-danger {
        background: #e53935;
        color: #fff;
        padding: 10px 20px;
        border-radius: 6px;
        text-decoration: none;
        border: none;
        cursor: pointer;
        transition: background 0.3s ease;
    }
    .btn-danger:hover {
        background: #b71c1c;
    }
    .btn-secondary {
        background: #757575;
        color: #fff;
        padding: 10px 20px;
        border-radius: 6px;
        text-decoration: none;
        transition: background 0.3s ease;
    }
    .btn-secondary:hover {
        background: #424242;
    }
</style>
{% endblock %}

{% block content %}
    <h2>Delete Agreement</h2>
    <p>Are you sure you want to delete "<strong>{{ agreement.title }}</strong>"?</p>

    <form method="post">
        {% csrf_token %}
        <div class="delete-actions">
            <button type="submit" class="btn-danger">Yes, Delete</button>
            <a href="{% url 'agreement_list' %}" class="btn-secondary">Cancel</a>
        </div>
    </form>
{% endblock %}
