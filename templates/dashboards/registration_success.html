<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Successful</title>
    <style>
        .success-container {
            text-align: center;
            padding: 50px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
            margin: 50px auto;
            max-width: 600px;
        }

        .success-icon {
            font-size: 80px;
            color: #2ecc71;
            margin-bottom: 20px;
        }

        .btn {
            display: inline-block;
            background-color: #3498db;
            color: white;
            padding: 12px 25px;
            text-decoration: none;
            border-radius: 4px;
            margin: 10px;
        }

        .btn-pdf {
            background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
        }

        .btn-pdf:hover {
            background: linear-gradient(135deg, #c0392b 0%, #e74c3c 100%);
        }

        .btn-secondary {
            background-color: #95a5a6;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="success-container">
            <div class="success-icon">✓</div>
            <h2>Registration Successful!</h2>
            <p>Student <strong>{{ student.full_name }}</strong> has been registered successfully with ID: <strong>{{
                    student.student_id }}</strong></p>
            <div>
                <a href="{% url 'dashboard:generate_student_pdf' student.id %}" target="_blank" class="btn btn-pdf">📄
                    Download Admission Form</a>
                <a href="{% url 'dashboard:generate_admission_fee_pdf' student.id %}" target="_blank"
                    class="btn btn-pdf" style="background: linear-gradient(135deg, #3498db 0%, #2980b9 100%);">📄
                    Admission Fee PDF</a>
                <a href="{% url 'dashboard:student_registration' %}" class="btn">Register Another Student</a>
                <a href="{% url 'dashboard:student_list' %}" class="btn btn-secondary">View All Students</a>
            </div>
        </div>
    </div>
</body>

</html>
