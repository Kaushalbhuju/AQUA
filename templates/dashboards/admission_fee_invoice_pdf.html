<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <style>
        @page {
            size: A4;
            margin: 0;
        }

        body {
            margin: 0;
            padding: 0;
            width: 210mm;
            height: 297mm;
            position: relative;
        }

        .background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        .background img {
            width: 100%;
            height: 100%;
        }

        .dynamic-field {
            position: absolute;
            font-family: 'Helvetica', 'Arial', sans-serif;
            font-weight: bold;
            color: #000;
        }

        .date {
            top: 135px;
            /* Lowered from 125px */
            right: 80px;
            font-size: 11pt;
        }

        .name {
            top: 206px;
            /* Lowered from 198px */
            left: 175px;
            font-size: 12pt;
            text-transform: uppercase;
        }
    </style>
</head>

<body>
    <div class="background">
        {% if bg_base64 %}
        <img src="data:image/jpeg;base64,{{ bg_base64 }}" alt="Background">
        {% endif %}
    </div>

    <div class="dynamic-field date">
        {{ current_date|date:"j F Y" }}
    </div>

    <div class="dynamic-field name">
        {{ student.full_name }}
    </div>
</body>

</html>
