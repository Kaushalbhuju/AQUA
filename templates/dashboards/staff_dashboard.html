{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Visa Navigation Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
      body {
        background-color: #f8f9fa;
      }
      .hero {
        padding: 12rem 6rem;
        text-align: center;
        background-color: #e9ecef;
        border-bottom: 30px solid #dee2e6;
      }
      .btn-group {
        margin-top: 8rem;
        display: flex;
        flex-direction: column; /* stack vertically */
        align-items: center;
        gap: 2rem; /* more spacing between buttons */
        width: 100%;
        max-width: 800px; /* wider container */
        margin-left: auto;
        margin-right: auto;
      }
      .btn-xxl {
        padding: 2rem 4rem;   /* much bigger padding */
        font-size: 2rem;      /* oversized text */
        border-radius: 0.75rem;
        width: 100%;          /* full width */
        font-weight: bold;    /* bold text */
      }
    </style>
  </head>
  <body>
    <!-- Navigation Header -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
      <div class="container-fluid">
        <a class="navbar-brand" href="#">Aqua Group</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link active" href="#">Home</a></li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- Hero Section -->
    <div class="hero">
      <h1 class="display-5 fw-bold">Where are you going to?</h1>
      <p class="lead">Choose your visa category to proceed with registration and documentation.</p>
      <div class="btn-group">
        <a href="{% url 'staff_ssw_working_visa' %}" class="btn btn-outline-primary btn-xxl">SSW & Working Visa</a>
        <a href="{% url 'staff_student_visa' %}" class="btn btn-outline-success btn-xxl">Student Visa</a>
        <a href="{% url 'dashboard' %}" class="btn btn-outline-success btn-xxl">Appointments</a>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>
