{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Visa Navigation Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
      body {
        background-color: #f8f9fa;
      }
      .hero {
        padding: 4rem 2rem;
        text-align: center;
        background-color: #e9ecef;
        border-bottom: 1px solid #dee2e6;
      }
      .btn-group {
        margin-top: 2rem;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 1rem;
      }
    </style>
  </head>
  <body>
    <!-- Navigation Header -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
      <div class="container-fluid">
        <a class="navbar-brand" href="#">Aqua Group</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link active" href="{% url 'accounts:login_view' %}"> Logout</a>
            </li>
          </ul>
          
        </div>
      </div>
    </nav>

    <!-- Hero Section -->
    <div class="hero">
      <h1 class="display-5 fw-bold">Where are you going to?</h1>
      <p class="lead">Choose your visa category to proceed with registration and documentation.</p>
      <div class="btn-group">
        <a href="{% url 'ssw_working_visa' %}" class="btn btn-outline-primary btn-lg">SSW & Working Visa</a>
        <a href="{% url 'student_visa' %}" class="btn btn-outline-success btn-lg">Student Visa</a>
        <a href="{% url 'staff_list' %}" class="btn btn-outline-warning btn-lg">Staff Registration</a>
        <a href="#" class="btn btn-outline-info btn-lg">Dependent Visa</a>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>
