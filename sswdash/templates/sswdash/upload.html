{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="icon" type="image/png" href="{% static 'images/logo.png' %}">

    <meta charset="UTF-8">
    <title>Upload Document</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 600px;
            margin: 50px auto;
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: #333;
        }

        form {
            margin-top: 20px;
        }

        input,
        button {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            background: #007bff;
            color: #fff;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        button:hover {
            background: #0056b3;
        }

        .link {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #007bff;
            text-decoration: none;
        }

        .link:hover {
            text-decoration: underline;
        }
    </style>
    <script>
        function validateForm() {
            const fileInput = document.querySelector('input[type="file"]');
            if (fileInput.files.length === 0) {
                alert("Please select a file to upload.");
                return false;
            }
            const file = fileInput.files[0];
            if (!file.name.endsWith('.pdf')) {
                alert("Only PDF files are allowed.");
                return false;
            }
            return true;
        }
    </script>
</head>

<body>
    <div class="container">
        <h1>Upload a PDF Document</h1>
        <form method="post" enctype="multipart/form-data" onsubmit="return validateForm();">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Upload</button>
        </form>
        <a href="{% url 'sswdash:list_documents' %}" class="link">View Uploaded Documents</a>
    </div>
</body>

</html>
