{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="icon" type="image/png" href="{% static 'images/logo.png' %}">

    <meta charset="UTF-8">
    <title>Uploaded Documents</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eef2f7;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 800px;
            margin: 50px auto;
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: #333;
        }

        ul {
            list-style: none;
            padding: 0;
        }

        li {
            background: #f9f9f9;
            margin: 10px 0;
            padding: 15px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        li a {
            color: #007bff;
            text-decoration: none;
            margin-right: 15px;
        }

        li a:hover {
            text-decoration: underline;
        }

        button {
            background: #dc3545;
            color: #fff;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        button:hover {
            background: #a71d2a;
        }

        .link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #007bff;
            text-decoration: none;
        }

        .link:hover {
            text-decoration: underline;
        }
    </style>
    <script>
        function confirmDelete() {
            return confirm("Are you sure you want to delete this document?");
        }
    </script>
</head>

<body>
    <div class="container">
        <h1>Uploaded Documents</h1>
        <ul>
            {% for doc in documents %}
            <li>
                <span>
                    <strong>{{ doc.title }}</strong>
                    (Uploaded on {{ doc.upload_date }})
                    <a href="{{ doc.uploaded_file.url }}" target="_blank">View PDF</a>
                </span>
                <form method="post" action="{% url 'sswdash:delete_document' doc.pk %}"
                    onsubmit="return confirmDelete();" style="margin:0;">
                    {% csrf_token %}
                    <button type="submit">Delete</button>
                </form>
            </li>
            {% empty %}
            <li>No documents uploaded yet.</li>
            {% endfor %}
        </ul>
        <a href="{% url 'sswdash:upload_document' %}" class="link">Upload New Document</a>
    </div>
</body>

</html>
